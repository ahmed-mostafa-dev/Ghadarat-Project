services:
  redis:
    image: redis:7-alpine
    container_name: ghadarat-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  redis_data: